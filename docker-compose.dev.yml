services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  game-server:
    image: eclipse-temurin:25-jdk
    ports:
      - "${SERVER_PORT}:10000"
    environment:
      - DB_URL=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./:/app
    working_dir: /app
    command: ./gradlew :server:run --continuous
    depends_on:
      - postgres

volumes:
  postgres_data_dev: